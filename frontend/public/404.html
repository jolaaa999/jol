<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>JOL</title>
    <script>
      /*
       * GitHub Pages SPA 深链兜底。
       *
       * Pages 是纯静态托管：对 /jol/blog/post/xxx 这类客户端路由返回真实 404，
       * 而 index.html 只在根路径可用（不像 Vercel 有 rewrites）。官方推荐做法是
       * 用一个 404.html 把原始路径交给首页，再由首页还原路由。
       *
       * 关键点：不能用 document.currentScript 推断部署前缀 —— 内联脚本中它可能为
       * null（脚本被注入或延迟执行时），一旦回退成 '/' 就会丢掉 '<repo>/' 前缀，
       * 跳到站点根并再次 404（实测踩过此坑）。
       *
       * 改为直接根据 location.pathname 首段判断：项目页部署时，404.html 位于
       * /<repo>/404.html，被访问的深链也必然以 /<repo>/ 开头，因此首段即仓库名；
       * 用户页 / 自定义域名则首段就是应用路由本身。
       */
      ;(function () {
        // 应用自身的顶层路由，出现这些说明当前是根部署（无仓库前缀）
        var APP_ROUTES = ['blog', 'entry', 'landing']

        var segs = window.location.pathname.split('/').filter(Boolean)
        var base = '/'

        if (segs.length && APP_ROUTES.indexOf(segs[0]) === -1) {
          // 首段不是应用路由 => 视为项目页的仓库前缀
          base = '/' + segs[0] + '/'
          segs = segs.slice(1)
        }

        // 约定：hash 形如 `#/blog/post/xxx`（带前导斜杠），
        // 与 index.html 的还原脚本严格对应，避免两侧约定漂移。
        var target = base + (segs.length ? '#/' + segs.join('/') : '')
        window.location.replace(target + window.location.search)
      })()
    </script>
  </head>
  <body>
    <p>正在跳转…</p>
  </body>
</html>
